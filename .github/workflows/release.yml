name: Validate public release metadata
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate public metadata
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json')); const v=JSON.parse(fs.readFileSync('versions.json')); if(m.id!=='zhaohua-xishi'||v[m.version]!==m.minAppVersion)throw Error('Invalid release metadata'); console.log('Release metadata validated. Production source builds run in the private source repository.');"
